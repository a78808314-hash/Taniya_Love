<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برای تانیا ✨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;800&display=swap');

*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Vazirmatn',sans-serif;
    background:#030305;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,0,130,.18),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(100,50,255,.18),transparent 30%);
}

.orb{
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.3;
    animation:orb 10s infinite alternate ease-in-out;
}

.orb.one{background:#ff1683;top:-200px;left:-150px}
.orb.two{background:#743cff;bottom:-200px;right:-150px;animation-delay:2s}

.intro{
    position:relative;
    z-index:5;
    text-align:center;
    transition:1s;
}

.intro.hide{
    opacity:0;
    transform:scale(1.2);
    pointer-events:none;
}

.intro p{
    color:#aaa;
    font-size:14px;
    margin-bottom:25px;
}

.main-heart{
    width:120px;
    height:120px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    font-size:55px;
    cursor:pointer;
    box-shadow:
        0 0 40px rgba(255,0,130,.25),
        inset 0 0 30px rgba(255,255,255,.05);
    animation:pulse 2s infinite;
    transition:.4s;
}

.main-heart:hover{
    transform:scale(1.12);
    box-shadow:
        0 0 70px rgba(255,0,130,.5),
        inset 0 0 30px rgba(255,255,255,.08);
}

.card{
    position:absolute;
    z-index:4;
    width:min(92%,700px);
    padding:55px 45px;
    text-align:center;
    opacity:0;
    transform:translateY(40px) scale(.95);
    pointer-events:none;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.13);
    border-radius:35px;
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    box-shadow:
        0 40px 100px rgba(0,0,0,.6),
        inset 0 1px rgba(255,255,255,.1);
    transition:1s cubic-bezier(.2,.8,.2,1);
}

.card.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.small{
    color:#ff72b5;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:20px;
}

h1{
    margin:0 0 30px;
    font-size:clamp(50px,10vw,85px);
    font-weight:800;
    background:linear-gradient(90deg,#fff,#ff63ad,#b68cff,#fff);
    background-size:300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradient 5s linear infinite;
}

.message{
    font-size:clamp(16px,3vw,21px);
    line-height:2.3;
    color:#e8e8e8;
}

.highlight{
    color:#ff78b8;
    font-weight:600;
}

.cursor{
    display:inline-block;
    width:2px;
    height:22px;
    background:#ff65ad;
    margin-right:4px;
    animation:blink .7s infinite;
}

.signature{
    margin-top:35px;
    color:#777;
    font-size:13px;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    opacity:.4;
    animation:particle 8s linear infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

@keyframes gradient{
    to{background-position:300%}
}

@keyframes orb{
    from{transform:translate(0,0)}
    to{transform:translate(180px,100px)}
}

@keyframes blink{
    50%{opacity:0}
}

@keyframes particle{
    from{transform:translateY(100vh);opacity:0}
    20%{opacity:.5}
    to{transform:translateY(-20vh);opacity:0}
}

@media(max-width:600px){
    .card{
        padding:40px 25px;
        border-radius:28px;
    }
    .message{line-height:2.15}
    .main-heart{
        width:100px;
        height:100px;
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<div class="intro" id="intro">
    <p>یه چیزی هست که مدت‌هاست می‌خوام بهت بگم...</p>

    <div class="main-heart" onclick="openMessage()" aria-label="باز کردن پیام">
        ❤️
    </div>

    <p>برای دیدنش روی قلب بزن</p>
</div>

<div class="card" id="card">
    <div class="small">FOR YOU · TANIA</div>

    <h1>تانیا</h1>

    <div class="message" id="message"></div>

    <div class="signature">
        بعضی آدم‌ها اتفاقی وارد زندگی آدم نمی‌شن... ✨
    </div>
</div>

<script>
const lines = [
    "نمی‌دونم دقیقاً از کِی شد که این‌قدر برام خاص شدی،",
    "فقط می‌دونم بین همه‌ی آدم‌ها،",
    "دلم یه جوری فقط با تو آروم می‌گیره.",
    "",
    "با تو بودن برای من فقط یه حس قشنگ نیست؛",
    "یه چیزی فراتر از این حرفاست...",
    "یه حس که باعث میشه بی‌دلیل لبخند بزنم،",
    "دلم بخواد بیشتر کنارت باشم،",
    "و از ته دلم بگم:",
    "",
    "تانیا، خوشحالم که توی دنیای منی. ❤️"
];

function openMessage(){
    document.getElementById("intro").classList.add("hide");

    setTimeout(() => {
        document.getElementById("card").classList.add("show");
        typeLines();
    }, 700);
}

function typeLines(){
    const box = document.getElementById("message");
    let lineIndex = 0;
    let charIndex = 0;

    function type(){
        if(lineIndex >= lines.length){
            box.innerHTML += '<span class="cursor"></span>';
            return;
        }

        const line = lines[lineIndex];

        if(charIndex < line.length){
            box.innerHTML += line.charAt(charIndex);
            charIndex++;
            setTimeout(type, 24);
        } else {
            box.innerHTML += "<br>";
            lineIndex++;
            charIndex = 0;
            setTimeout(type, line === "" ? 180 : 70);
        }
    }

    type();
}

for(let i=0;i<45;i++){
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100 + "vw";
    p.style.animationDelay = Math.random()*8 + "s";
    p.style.animationDuration = 5 + Math.random()*8 + "s";
    document.querySelector(".bg").appendChild(p);
}
</script>

</body>
</html>
